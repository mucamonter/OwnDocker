name: WK3

services:
  # Serviço da Aplicação Web em modo Desenvolvimento
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: WK3_C1
    ports:
      - "8080:3000"  # <--- [Porta do PC : Porta do Código]
    environment:
      - NODE_ENV=development  # <--- Ativa erros detalhados e logs
    volumes:
      - .:/usr/src/app        # <--- Sincroniza seu código em tempo real com o PC
      - /usr/src/app/node_modules # <--- Protege as dependências do contêiner
    command: npm run dev      # <--- Executa o nodemon/live reload da sua aplicação
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-local
    restart: always

  # Serviço do Banco de Dados (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: WK3_cont
    environment:
      POSTGRES_USER: Muca
      POSTGRES_PASSWORD: 123  # <--- Simplificado para desenvolvimento local
      POSTGRES_DB: WK3_DB
    ports:
      - "5432:5432"  # <--- Permite que você conecte no banco via DBeaver/pgAdmin se quiser
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    networks:
      - rede-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murilomonteiro -d WK3_DB"]
      interval: 5s   # <--- Mais rápido para o ambiente de desenvolvimento
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  dados_postgres:
    driver: local

networks:
  rede-local:
    driver: bridge
