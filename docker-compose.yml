name: WK3

services:
  # Serviço da Aplicação Web em modo Desenvolvimento
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: WK3_C1
    ports:
      - "8080:3000"  
    environment:
      - NODE_ENV=development  
    volumes:
      - .:/app    
      - /app/node_modules
    command: npm run dev   
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-local
    restart: always

  # Serviço do Banco de Dados (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: WK3_cont
    environment:
      POSTGRES_USER: Muca
      POSTGRES_PASSWORD: "123" 
      POSTGRES_DB: WK3_DB
    ports:
      - "5432:5432" 
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Muca -d WK3_DB"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  dados_postgres:
    driver: local

networks:
  rede-local:
    driver: bridge
