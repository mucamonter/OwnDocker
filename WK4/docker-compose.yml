

services:
  
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}:3306/WK4_DB
      - NODE_ENV=development
    depends_on:
      - db
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=WK4_DB
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: